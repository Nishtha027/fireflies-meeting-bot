name: fireflies-clone-db

services:
  db:
    image: postgres:17-alpine
    container_name: fireflies-clone-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fireflies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fireflies_clone}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - fireflies-clone-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fireflies} -d ${POSTGRES_DB:-fireflies_clone}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fireflies-clone-db-data:
